name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # The end-to-end tests run the real binary against a mock API on localhost.
      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute release tag
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="godspeed-cli-${{ steps.meta.outputs.tag }}-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$name.tar.gz" godspeed-cli
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: godspeed-cli-*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v${version}-build.${{ github.run_number }}"

          # The notes are this version's section of CHANGELOG.md. If there is none, fall back to the
          # notes GitHub generates from the commits, and say so, rather than stopping a release.
          if bash scripts/release-notes.sh "$version" > release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::CHANGELOG.md has no notes for $version, so GitHub's generated notes are used"
            notes=(--generate-notes)
          fi

          gh release create "$tag" dist/* \
            --target "${{ github.sha }}" \
            --title "$tag" \
            "${notes[@]}"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v${version}-build.${{ github.run_number }}"
          # Homebrew needs a plain dotted version so upgrades order numerically
          brew_version="${version}.${{ github.run_number }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"

          sha() { cut -d' ' -f1 "dist/godspeed-cli-${tag}-$1.tar.gz.sha256"; }
          url() { echo "${base}/godspeed-cli-${tag}-$1.tar.gz"; }

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/quintrino/homebrew-tap.git" tap

          tap_dir="$PWD/tap"
          write_formula() {
          cat > "$tap_dir/Formula/godspeed-cli.rb" <<RUBY
          class GodspeedCli < Formula
            desc "Rust-based Godspeed CLI"
            homepage "https://github.com/${{ github.repository }}"
            version "${brew_version}"

            on_macos do
              if Hardware::CPU.arm?
                url "$(url aarch64-apple-darwin)"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "$(url x86_64-apple-darwin)"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              depends_on "openssl@3"

              url "$(url x86_64-unknown-linux-gnu)"
              sha256 "$(sha x86_64-unknown-linux-gnu)"
            end

            def install
              bin.install "godspeed-cli"
            end

            test do
              system "#{bin}/godspeed-cli", "--version"
            end
          end
          RUBY
          }

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3; do
            # Start from the tap as it is now and write the formula again. Never `git pull --rebase`:
            # two releases both rewrite this one file, so the rebase conflicts and leaves the tap
            # half-applied ("could not apply ... godspeed-cli 0.1.0.1").
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            write_formula
            git add Formula/godspeed-cli.rb
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "godspeed-cli ${brew_version}"
            git push origin "HEAD:$branch" && exit 0
          done
          exit 1

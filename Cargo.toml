[package]
name = "godspeed-cli"
version = "0.10.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "1"
